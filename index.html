<style>
  * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
  html, body { margin: 0; padding: 0; overflow: hidden; font-family: 'Pretendard Variable', Pretendard, -apple-system, system-ui, sans-serif; word-break: keep-all; }
  body { background: #f4f4f4; }
  #root { width: 100%; height: 100vh; height: 100dvh; }
  .app-shell { position: relative; width: 100%; max-width: 640px; margin: 0 auto; height: 100%; }
  .bottom-actions { padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px)); }
  .share-dialog { position: fixed; inset: auto 0 0; margin: 0 auto; padding: 0; width: 100%; max-width: 640px; border: 0; border-radius: 24px 24px 0 0; animation: sheetUp 0.2s ease; }
  .share-dialog::backdrop { background: rgba(0,0,0,0.48); }
  .restaurant-toggle { width: 100%; min-height: 44px; display: flex; align-items: center; gap: 8px; margin-top: 10px; padding: 9px 10px; border: 1px solid #e4e4e4; border-radius: 10px; background: #f7f7f7; color: #1a1a1a; text-align: left; cursor: pointer; }
  .restaurant-toggle > span:nth-child(2) { color: #5a554e; font-size: 12px; }
  .restaurant-toggle__chevron { margin-left: auto; display: flex; transition: transform 0.18s ease; }
  .restaurant-toggle[aria-expanded="true"] .restaurant-toggle__chevron { transform: rotate(180deg); }
  .restaurant-section { margin-top: 13px; animation: fadeIn 0.2s ease; }
  .restaurant-section__heading, .restaurant-section__meta { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 12px; }
  .restaurant-section__heading { justify-content: space-between; color: #5a554e; font-weight: 600; }
  .restaurant-section__meta { margin-top: 7px; color: #5e5e5e; font-size: 12px; }
  .restaurant-section__meta a, .restaurant-status a, .restaurant-retry { color: #195caf; font-weight: 700; }
  .restaurant-google { font: 400 12px Roboto, sans-serif; letter-spacing: normal; color: #5e5e5e; white-space: nowrap; }
  .restaurant-status { margin: 9px 0 0; color: #5a554e; line-height: 1.5; }
  .restaurant-status p { margin: 0 0 7px; }
  .restaurant-retry { min-height: 36px; margin-right: 10px; border: 1px solid #ddd; border-radius: 8px; background: #fff; cursor: pointer; }
  .restaurant-carousel { display: flex; align-items: stretch; gap: 9px; overflow-x: auto; scroll-snap-type: x proximity; list-style: none; padding: 3px 1px 8px; margin: 7px 0 0; scrollbar-width: thin; scrollbar-color: #cecece transparent; }
  .restaurant-card { flex: 0 0 min(79%, 226px); min-width: 0; overflow: hidden; scroll-snap-align: start; border: 1px solid #e7e7e7; border-radius: 12px; background: #fff; }
  .restaurant-card__main { display: block; color: #1a1a1a; text-decoration: none; }
  .restaurant-card__main:focus-visible { outline-offset: -3px; }
  .restaurant-card__photo { display: grid; place-items: center; aspect-ratio: 16 / 9; overflow: hidden; background: #ffe9f2; }
  .restaurant-card__photo img { width: 100%; height: 100%; object-fit: cover; }
  .restaurant-card__details { display: grid; gap: 4px; padding: 9px 10px 10px; }
  .restaurant-card__title, .restaurant-card__description { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .restaurant-card__title { font-weight: 800; font-size: 14px; }
  .restaurant-card__description { color: #5a554e; font-size: 12px; }
  .restaurant-card__numbers { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 2px 6px; font-size: 12px; color: #3d3935; font-variant-numeric: tabular-nums; }
  .restaurant-card__star { color: #865800; }
  .restaurant-card__credits { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 7px; padding: 6px 10px; border-top: 1px solid #f0f0f0; font-size: 11px; color: #5e5e5e; overflow-wrap: anywhere; }
  .restaurant-card__credits a { display: inline-flex; align-items: center; gap: 3px; color: inherit; }
  .restaurant-card__credits img { width: 13px; height: 13px; border-radius: 50%; object-fit: cover; }
  :focus-visible { outline: 2px solid #2465c4; outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }
  input { font-family: inherit; }
  button { font-family: inherit; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes pulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
  @keyframes dashFlow { to { stroke-dashoffset: -16; } }
  @keyframes trainMove {
    0%   { transform: translate(14px, 0) rotate(-20deg); }
    50%  { transform: translate(120px, 0) rotate(0deg); }
    100% { transform: translate(226px, 0) rotate(20deg); }
  }
  @keyframes rpsSpin {
    0%, 100% { transform: translateY(0) rotate(-8deg); }
    50% { transform: translateY(-8px) rotate(8deg); }
  }
  @keyframes wander {
    0%, 100% { transform: rotate(-10deg); }
    50% { transform: rotate(10deg); }
  }
  @keyframes sheetUp {
    from { transform: translateY(100%); }
    to   { transform: translateY(0); }
  }
  /* Hide scrollbars for a cleaner mobile look */
  div::-webkit-scrollbar { display: none; }
  div { scrollbar-width: none; }
</style>
